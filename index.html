<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#398663"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Buffet des Saveurs"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Le Buffet des Saveurs</title><style>:root{--accent:#398663;--bg:#f7f8f7;--card:white;--fg:#26352c;--muted:#647269}body.dark{--bg:#171c19;--card:#252e28;--fg:#f4f7f4;--muted:#b6c2b8}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--fg)}header{background:var(--accent);color:white;padding:22px 16px 18px}header h1{font-size:21px;margin:0}header small{opacity:.85}nav{display:flex;position:sticky;top:0;background:var(--card);z-index:3;box-shadow:0 1px 5px #0002}nav button{flex:1;border:0;background:none;color:var(--fg);padding:14px 3px;font-size:12px}nav button.on{color:var(--accent);border-bottom:3px solid var(--accent);font-weight:bold}main{max-width:800px;margin:auto;padding:16px 14px 80px}.card{background:var(--card);padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 1px 6px #0001}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:var(--muted);font-size:13px}input,select,textarea{background:var(--card);color:var(--fg);border:1px solid #9daaa0;border-radius:9px;padding:12px;width:100%;font:inherit;margin:6px 0 12px}button{cursor:pointer}.btn{border:0;background:var(--accent);color:white;border-radius:10px;padding:12px 16px}.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent)}.pill{border-radius:20px;background:#e2efe6;color:#25583b;padding:5px 9px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.number{font-size:21px;font-weight:700}.hide{display:none}label{font-size:13px;font-weight:600}.notice{background:#fff4d9;color:#654c1c;padding:12px;border-radius:10px;font-size:13px}h2{font-size:21px}h3{font-size:16px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1}.color{width:32px;height:32px;border-radius:50%;border:2px solid #aaa;display:inline-block;margin-right:8px}.click{cursor:pointer}</style></head><body><header><h1>🍽 Le Buffet des Saveurs</h1><small>Gestion des devis · version mobile</small></header><nav><button onclick="go('home')" id="nav-home">Accueil</button><button onclick="go('quotes')" id="nav-quotes">Devis</button><button onclick="go('calendar')" id="nav-calendar">Planning</button><button onclick="go('settings')" id="nav-settings">Réglages</button></nav><main id="main"></main><script>
const key='bds_pwa_v1', settingsKey='bds_pwa_settings';let orders=JSON.parse(localStorage.getItem(key)||'[]'),settings=JSON.parse(localStorage.getItem(settingsKey)||'{"color":"#398663","dark":false}'),page='home',q='',filter='Tous',date=new Date().toISOString().slice(0,10),period='month',year=new Date().getFullYear(),month=new Date().toISOString().slice(0,7),editing=null;const statuses=['En attente','En cours','Accepté','Refusé','Terminé'],progresses=['Non commencée','À préparer','En préparation','Prête','Livrée','Terminée'];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}function save(){localStorage.setItem(key,JSON.stringify(orders))}function apply(){document.documentElement.style.setProperty('--accent',settings.color);document.body.classList.toggle('dark',settings.dark);localStorage.setItem(settingsKey,JSON.stringify(settings))}function go(p){page=p;render()}function edit(id){editing=id;page='edit';render()}function statusChange(id,v){orders.find(o=>o.id===id).status=v;save();render()}function progressChange(id,v){orders.find(o=>o.id===id).progress=v;save();render()}function render(){apply();for(const b of document.querySelectorAll('nav button'))b.classList.toggle('on',b.id==='nav-'+page);let h='';if(page==='home'){let list=orders.filter(o=>o.date.startsWith(period==='month'?month:String(year))),acc=list.filter(o=>['Accepté','Terminé'].includes(o.status)),pend=list.filter(o=>o.status==='En attente');h=`<h2>Tableau de bord</h2><div class="tools"><button class="btn ${period==='month'?'':'secondary'}" onclick="period='month';render()">Par mois</button><button class="btn ${period==='year'?'':'secondary'}" onclick="period='year';render()">Par année</button></div>${period==='month'?`<input type="month" value="${month}" onchange="month=this.value;render()">`:`<input type="number" value="${year}" onchange="year=+this.value;render()">`}<div class="grid"><div class="card"><div class="muted">Devis acceptés</div><div class="number">${money(acc.reduce((s,o)=>s+o.amount,0))}</div></div><div class="card"><div class="muted">En attente</div><div class="number">${money(pend.reduce((s,o)=>s+o.amount,0))}</div></div><div class="card"><div class="muted">Total des devis</div><div class="number">${money(list.reduce((s,o)=>s+o.amount,0))}</div></div><div class="card"><div class="muted">Commandes terminées</div><div class="number">${list.filter(o=>o.progress==='Terminée').length}</div></div></div><div class="card"><h3>Évolution mensuelle · ${year}</h3>${Array.from({length:12},(_,i)=>{let m=`${year}-${String(i+1).padStart(2,'0')}`,v=orders.filter(o=>o.date.startsWith(m)&&['Accepté','Terminé'].includes(o.status)).reduce((s,o)=>s+o.amount,0);return `<div class="row muted"><span>${new Date(year,i,1).toLocaleDateString('fr-FR',{month:'short'})}</span><b>${money(v)}</b></div>`}).join('')}</div><button class="btn" onclick="edit(null)">+ Nouveau devis</button>`}
if(page==='quotes'){let visible=orders.filter(o=>(filter==='Tous'||o.status===filter)&&(o.ref+' '+o.client).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));h=`<div class="row"><h2>Devis</h2><button class="btn" onclick="edit(null)">+ Ajouter</button></div><input placeholder="Rechercher n° de devis, nom, prénom" value="${esc(q)}" oninput="q=this.value;renderSearch()" id="search"><select onchange="filter=this.value;render()">${['Tous',...statuses].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select><div id="results">${quoteCards(visible)}</div>`}
if(page==='calendar'){h=`<h2>Planning</h2><input type="date" value="${date}" onchange="date=this.value;render()"><p class="muted">Les devis refusés sont masqués du planning.</p>${quoteCards(orders.filter(o=>o.date===date&&o.status!=='Refusé').sort((a,b)=>a.time.localeCompare(b.time)))}`}
if(page==='settings'){h=`<h2>Apparence</h2><div class="card"><h3>Couleur principale</h3>${['#398663','#347CC0','#8060BA','#C46B90','#D07A35','#34383E'].map(c=>`<button class="color" style="background:${c};${settings.color===c?'outline:3px solid var(--fg)':''}" onclick="settings.color='${c}';render()" aria-label="Couleur ${c}"></button>`).join('')}<p><label><input style="width:auto" type="checkbox" ${settings.dark?'checked':''} onchange="settings.dark=this.checked;render()"> Mode sombre</label></p></div><h3>Sauvegarde</h3><p class="muted">Exportez régulièrement les devis : ils sont stockés uniquement sur cet appareil dans cette version.</p><button class="btn" onclick="exportData()">Exporter mes devis (JSON)</button><div class="card"><label>Restaurer une sauvegarde JSON</label><input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></div>`}
if(page==='edit'){let o=orders.find(o=>o.id===editing)||{id:null,ref:'',client:'',date:new Date().toISOString().slice(0,10),time:'',amount:0,status:'En attente',progress:'À préparer',items:''};h=`<h2>${o.id?'Modifier le devis':'Nouveau devis'}</h2><form id="quoteForm" onsubmit="saveForm(event)"><label>Numéro de devis</label><input name="ref" required value="${esc(o.ref)}" placeholder="DE00002905"><label>Nom et prénom</label><input name="client" required value="${esc(o.client)}"><label>Date de prestation</label><input name="date" type="date" required value="${esc(o.date)}"><label>Heure (facultative)</label><input name="time" type="time" value="${esc(o.time)}"><label>Montant TTC (€)</label><input name="amount" type="number" min="0" step=".01" required value="${o.amount}"><label>Produits / notes</label><textarea name="items" rows="5">${esc(o.items)}</textarea><label>Statut commercial</label><select name="status">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><label>Suivi de la commande</label><select name="progress">${progresses.map(s=>`<option ${s===o.progress?'selected':''}>${s}</option>`).join('')}</select><button class="btn" type="submit">Enregistrer</button> <button type="button" class="btn secondary" onclick="go('quotes')">Annuler</button></form><div class="card"><h3>Import EBP</h3><p class="muted">La lecture automatique des PDF EBP n'est pas encore intégrée à cette version mobile. Vous pouvez saisir les informations manuellement.</p></div>`}
document.getElementById('main').innerHTML=h}function quoteCards(list){return list.length?list.map(o=>`<div class="card click" onclick="edit(${o.id})"><div class="row"><b>${esc(o.client)}</b><b>${money(o.amount)}</b></div><p class="muted">${esc(o.ref)} · ${esc(o.date)} ${esc(o.time)}</p><div class="row"><span class="pill">${esc(o.status)}</span><small>${esc(o.progress)}</small></div></div>`).join(''):'<div class="card muted">Aucun devis trouvé.</div>'}function renderSearch(){let el=document.getElementById('search');q=el.value;document.getElementById('results').innerHTML=quoteCards(orders.filter(o=>(filter==='Tous'||o.status===filter)&&(o.ref+' '+o.client).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))))}function saveForm(e){e.preventDefault();let d=new FormData(e.target),o={id:editing||Date.now(),ref:String(d.get('ref')).trim(),client:String(d.get('client')).trim(),date:d.get('date'),time:d.get('time'),amount:Number(d.get('amount')),items:d.get('items'),status:d.get('status'),progress:d.get('progress')};if(orders.some(x=>x.ref===o.ref&&x.id!==o.id)){alert('Ce numéro de devis existe déjà');return}orders=editing?orders.map(x=>x.id===editing?o:x):[...orders,o];save();go('quotes')}function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='buffet-des-saveurs-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v)||!v.every(o=>o.ref&&o.client&&o.date))throw Error();if(confirm('Remplacer les devis présents sur cet appareil par cette sauvegarde ?')){orders=v;save();go('quotes')}}catch{alert('Fichier de sauvegarde invalide')}}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
